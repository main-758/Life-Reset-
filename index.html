<link rel="icon" type="image/png" href="Life%20Reset%20app%20logo.png?v=2"><link rel="apple-touch-icon" href="Life%20Reset%20app%20logo.png?v=2"><link rel="manifest" href="manifest.json"><title>Life Reset</title>
<style>
:root{--bg:#f6f6fb;--panel:#fff;--ink:#171722;--muted:#77788a;--line:#e8e8f0;--brand:#7357ff;--brand2:#a18dff;--dark:#0d0d14;--good:#1c9b68;--warn:#e89b2c;--bad:#df5353;--blue:#4285f4;--shadow:0 18px 50px rgba(30,24,70,.08);--r:24px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:255px;overflow-y:auto;background:var(--dark);color:#fff;padding:24px 16px;display:flex;flex-direction:column;z-index:20}.logo{font-size:24px;font-weight:950;padding:8px 12px 28px;letter-spacing:-1px}.logo span{color:#a998ff}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#aaa8b7;padding:13px 14px;border-radius:14px;text-align:left;font-weight:800;cursor:pointer;font-size:14px}.nav button:hover,.nav button.active{background:#24232d;color:#fff}.sideProfile{margin-top:auto;border:1px solid #302f3a;background:#1a1922;border-radius:18px;padding:13px}.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#b6aaff);display:grid;place-items:center;font-weight:950}.main{margin-left:255px;padding:28px;max-width:1500px}.mobile{display:none}.view{display:none}.view.active{display:block}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:24px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:950;color:var(--brand)}h1{font-size:clamp(30px,4vw,48px);line-height:1;margin:5px 0 10px;letter-spacing:-2px}h2{font-size:25px;letter-spacing:-.8px;margin:0 0 7px}h3{margin:0 0 6px}.muted{color:var(--muted);line-height:1.55}.small{font-size:12px;color:var(--muted)}.grid{display:grid;gap:18px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:23px;box-shadow:var(--shadow);margin-bottom:18px}.hero{background:linear-gradient(135deg,#171524,#302650);color:#fff;border:0;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:#8c72ff;filter:blur(70px);opacity:.22;right:-80px;top:-80px}.heroGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;position:relative;z-index:1}.resetVisual{min-height:220px;display:grid;place-items:center;position:relative}.visualGlow{position:absolute;width:210px;height:210px;border-radius:50%;background:#9b83ff66;filter:blur(35px)}.visualCard{width:230px;height:165px;background:#fff;border-radius:22px;box-shadow:0 25px 60px #0005;padding:16px;transform:rotate(4deg);position:relative}.visualTop{display:flex;gap:5px}.visualTop span{width:7px;height:7px;border-radius:50%;background:#d9d5e2}.visualLine{height:9px;border-radius:9px;background:#e7e3ef;width:78%;margin-top:15px}.visualLine.wide{width:92%;height:13px;background:#d8d0ff}.visualLine.short{width:54%;margin-top:10px}.visualCheck{position:absolute;right:16px;bottom:15px;width:38px;height:38px;border-radius:12px;background:#7658ff;color:#fff;display:grid;place-items:center;font-weight:950}.visualBadge{position:absolute;right:10px;bottom:10px;background:#171524;color:#fff;border-radius:15px;padding:9px 13px;font-weight:950;box-shadow:0 12px 30px #0004;display:grid;gap:2px}.visualBadge small{font-size:9px;color:#c9c3d5;font-weight:700}.hero h2{font-size:34px;max-width:700px}.hero .muted{color:#c7c4d4}.btn{border:0;border-radius:13px;padding:11px 15px;font-weight:850;cursor:pointer;background:#ecebf3;color:var(--ink)}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--brand);color:#fff}.btn.dark{background:#24232f;color:#fff}.btn.white{background:#fff;color:#171722}.btn.danger{background:#ffe9e9;color:#b83e3e}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.stat{background:var(--panel);border:1px solid var(--line);border-radius:19px;padding:20px}.num{font-size:29px;font-weight:950;letter-spacing:-1px}.positive{color:var(--good)}.negative{color:var(--bad)}.label{font-size:12px;color:var(--muted);margin-top:3px}.progress{height:9px;background:#ececf3;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:inherit}.circle{width:142px;height:142px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--brand) var(--deg),#3b3948 0);position:relative}.circle:after{content:"";position:absolute;inset:11px;border-radius:50%;background:#211d31}.circle strong{position:relative;z-index:1;font-size:29px}.task{display:flex;gap:12px;align-items:center;border:1px solid var(--line);padding:14px;border-radius:16px;margin:9px 0;background:#fff}.task input{width:20px;height:20px;accent-color:var(--brand)}.task.done{opacity:.58}.task.done .taskTitle{text-decoration:line-through}.taskTitle{font-weight:800}.tag{display:inline-block;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;padding:4px 7px;border-radius:99px;background:#eeeef5;color:#656579;margin:5px 5px 0 0}.tag.red{background:#ffe8e8;color:#ba4a4a}.tag.green{background:#e3f8ef;color:#18815a}.tag.blue{background:#e8f0ff;color:#3971d6}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed #d8d8e3;border-radius:16px}.field{display:grid;gap:7px}.field label{font-size:12px;font-weight:850}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;font:inherit;outline:none;background:#fff}.field textarea{min-height:150px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px #7357ff18}.choice{border:1px solid var(--line);border-radius:17px;padding:16px;cursor:pointer;background:#fff}.choice:hover{border-color:#b9afff;background:#fbfaff}.choice b{display:block;margin-bottom:5px}.notice{background:#f4f1ff;border:1px solid #ded7ff;padding:14px;border-radius:15px;color:#4f438e}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.listRow{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}.listRow:last-child{border-bottom:0}.moneyBox{background:linear-gradient(135deg,#f2efff,#fff);border:1px solid #e1dcff}.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.premium{background:linear-gradient(135deg,#15121f,#30234a);color:#fff;border:0}.premium .muted{color:#c8c2d5}.price{font-size:42px;font-weight:950}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:#171722;color:#fff;padding:13px 17px;border-radius:13px;font-weight:750;z-index:50;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px;z-index:60}.modal.open{display:grid}.modalCard{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:25px;padding:24px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:70px;border:1px solid var(--line);border-radius:13px;padding:8px;background:#fff}.day.today{border:2px solid var(--brand);background:#faf9ff}.day b{font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin:4px 3px 0 0}.switch{display:flex;gap:10px;align-items:center}.switch input{width:18px;height:18px}.hide{display:none!important}
@media(max-width:1000px){.side{display:none}.main{margin:0;padding:16px 14px 90px}.mobile{display:flex;position:sticky;top:0;z-index:10;background:#111018;color:#fff;margin:-16px -14px 18px;padding:12px 14px;align-items:center;justify-content:space-between}.g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.heroGrid{grid-template-columns:1fr}.mode{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.g2,.g3,.g4{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.card{padding:18px}.hero h2{font-size:27px}.mode{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}}

 .accountBar{display:flex;align-items:center;gap:10px}
.accountBtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:11px 15px;font-weight:900;cursor:pointer;box-shadow:0 8px 24px rgba(30,24,70,.06)}
.accountBtn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.accountBtn:hover{transform:translateY(-1px)}
.authHero{background:linear-gradient(135deg,#171524,#342650);color:#fff;border-radius:22px;padding:24px;margin-bottom:18px;overflow:hidden;position:relative}
.authHero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:#9c83ff;filter:blur(55px);opacity:.2;right:-55px;top:-55px}
.authHero>*{position:relative;z-index:1}
.authTabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f0f6;padding:5px;border-radius:13px;gap:5px;margin:18px 0}
.authTabs button{border:0;background:transparent;padding:10px;border-radius:10px;font-weight:900;cursor:pointer}
.authTabs button.active{background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.06)}
@media(max-width:650px){.accountBar{width:100%;}.accountBtn{width:100%}}
.premium .stat{background:#fff!important;color:#171722!important;border:1px solid #e8e8f0!important}.premium .stat b,.premium .stat .small{color:#171722!important}.premium .stat .small{color:#666778!important}.premium .muted{color:#d5d0e0}.premium .card{color:#171722!important}.premium .card .small{color:#666778!important}<style id="life-reset-app-polish">body.native-app{background:linear-gradient(180deg,#f8f6ff,#f1eff8);padding-bottom:110px}body.native-app .side{display:none}body.native-app .main{margin:0 auto;max-width:760px;padding:16px 16px 120px}body.native-app .mobile{display:flex;position:sticky;top:0;margin:-16px -16px 18px;padding:12px 16px;background:rgba(13,13,20,.9);backdrop-filter:blur(22px);border-radius:0 0 22px 22px;z-index:30}body.native-app .mobile .btn.dark{display:none}body.native-app .accountBtn{min-height:40px;border-radius:14px}body.native-app .card{border-radius:24px;box-shadow:0 14px 40px rgba(39,27,84,.09)}body.native-app .hero{border-radius:28px}body.native-app .btn{min-height:46px;border-radius:15px}body.native-app .modal{padding:12px;align-items:end}body.native-app .modalCard{border-radius:28px 28px 18px 18px;max-height:86vh}.nativeDock{display:none;position:fixed;left:12px;right:12px;bottom:10px;z-index:40;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px;background:rgba(20,18,29,.94);backdrop-filter:blur(22px);border-radius:23px;box-shadow:0 18px 55px rgba(24,17,49,.28)}body.native-app .nativeDock{display:grid}.nativeDock button{border:0;background:transparent;color:#aaa7b6;border-radius:16px;padding:8px 3px;font:inherit;font-size:10px;font-weight:850}.nativeDock button span{display:grid;place-items:center;font-size:18px}.nativeDock button.active{background:#7357ff;color:#fff}.appShowcase{display:none!important}</style>
<body><script>
(function(){if(window.Capacitor){document.body.classList.add("native-app");}})();
</script>
<div class="app">
<aside class="side"><div class="logo">Life <span>Reset</span></div><div style="margin:-10px 0 16px;padding:0 4px"><div class="small" style="color:#9e9aa9">Your space to reset, refocus and move forward.</div></div><div class="nav" id="nav"></div><div class="sideProfile"><div class="row"><div class="avatar" id="avatar">LR</div><div><b id="sideName">Your Life</b><div class="small" style="color:#aaa8b7">Personal plan</div></div></div></div></aside>
<main class="main"><div class="mobile"><b>Life <span style="color:#a998ff">Reset</span></b><div class="accountBar"><button class="accountBtn primary" id="mobileAccountBtn" onclick="location.href='auth.html?mode=signin'">Sign in</button><button class="btn dark" onclick="openMobile()">☰</button></div></div>
<section id="dashboard" class="view active"></section><section id="today" class="view"></section><section id="brain" class="view"></section><section id="money" class="view"></section><section id="career" class="view"></section><section id="goals" class="view"></section><section id="progress" class="view"></section><section id="calendar" class="view"></section><section id="premium" class="view"></section><section id="contact" class="view"></section><section id="settings" class="view"></section><div id="downloadHub" class="card" style="margin-top:18px"><div class="eyebrow">LIFE RESET APP</div><h2>Get Life Reset on mobile</h2><p class="muted">The mobile app is being built as a dedicated Life Reset experience. Official store links will appear here when the app is published.</p><div class="row"><button class="btn" disabled>Google Play — Coming soon</button><button class="btn" disabled>App Store — Coming soon</button></div></div>
</main></div>
<div class="nativeDock"><button onclick="go('dashboard')"><span>⌂</span>Home</button><button onclick="go('today')"><span>✓</span>Today</button><button onclick="go('brain')"><span>✦</span>Reset</button><button onclick="go('goals')"><span>◎</span>Goals</button><button onclick="go('settings')"><span>⚙</span>More</button></div>
<div class="modal" id="modal"><div class="modalCard" id="modalCard"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='lifeReset3';
const NAV=[['dashboard','⌂','Dashboard'],['today','✓','Today'],['brain','✦','Brain Dump'],['money','$','Money Reset'],['career','↗','Career'],['goals','◎','Goals'],['progress','▥','Progress'],['calendar','□','Calendar'],['premium','★','Plus'],['contact','✉','Contact Us'],['settings','⚙','Settings']];
let state={user:{name:'',email:'',plan:'free'},tasks:[],brain:'',bills:[],income:[],applications:[],goals:[],history:[],settings:{dark:false}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function hasPlus(){return state.user&&state.user.plan==='plus'}
function requirePlus(feature){if(hasPlus())return true;openModal('Life Reset Plus',`<div class="premium" style="border-radius:18px;padding:20px"><div class="eyebrow" style="color:#b9aaff">PLUS FEATURE</div><h2 style="margin-top:7px">${esc(feature)}</h2><p class="muted">This is one of Life Reset's advanced planning tools. Free members can use the core tools; Plus unlocks the deeper planning and insight layer.</p><div class="row" style="margin-top:16px"><button class="btn primary" onclick="closeModal();window.openPlus()">Unlock Plus — $7.99/month</button><button class="btn" onclick="closeModal()">Not now</button></div></div>`);return false}
function smartMoney(){const bills=state.bills.reduce((a,x)=>a+Number(x.amount||0),0),inc=state.income.reduce((a,x)=>a+Number(x.amount||0),0),bal=inc-bills,ratio=inc?Math.round(bills/inc*100):0;openModal('Smart Money Forecast',`<div class="grid g3"><div class="stat"><div class="small">Income tracked</div><div class="num positive">${money(inc)}</div></div><div class="stat"><div class="small">Bills tracked</div><div class="num negative">${money(bills)}</div></div><div class="stat"><div class="small">Bills / income</div><div class="num">${ratio}%</div></div></div><div class="notice" style="margin-top:16px"><b>Planning snapshot</b><br>${bal>=0?'Your tracked income currently covers your tracked bills.':'Your tracked bills are higher than your tracked income.'} Add more income or bills to make this forecast more useful.</div>`)}
function careerInsights(){const total=state.applications.length,applied=state.applications.filter(x=>x.status==='Applied').length,interviews=state.applications.filter(x=>x.status==='Interview').length,offers=state.applications.filter(x=>x.status==='Offer').length;openModal('Career Strategy Insights',`<div class="grid g2"><div class="stat"><div class="num">${total}</div><div class="label">Career records</div></div><div class="stat"><div class="num">${interviews}</div><div class="label">Interviews</div></div><div class="stat"><div class="num">${applied}</div><div class="label">Awaiting reply</div></div><div class="stat"><div class="num">${offers}</div><div class="label">Offers</div></div></div><div class="notice" style="margin-top:16px"><b>Pipeline focus</b><br>${total?'Keep moving Target items into Applied, then follow up on Applied items before adding more.':'Add your first application to start building your career pipeline.'}</div>`)}
function goalRoadmap(){if(!requirePlus('Goal Roadmaps'))return;const active=state.goals.filter(g=>(Number(g.progress)||0)<100).length,done=state.goals.filter(g=>(Number(g.progress)||0)>=100).length;openModal('Goal Roadmaps',`<div class="grid g2"><div class="stat"><div class="num">${active}</div><div class="label">Active goals</div></div><div class="stat"><div class="num positive">${done}</div><div class="label">Finished goals</div></div></div><div class="notice" style="margin-top:16px"><b>Roadmap view</b><br>${active?'Your roadmap should focus on the goal with the clearest next physical action first.':'Create a goal to begin your roadmap.'}</div>`)}
function progressInsights(){const total=state.tasks.length,done=completed(),rate=total?Math.round(done/total*100):0;openModal('Deep Progress Insights',`<div class="grid g3"><div class="stat"><div class="num">${rate}%</div><div class="label">Completion rate</div></div><div class="stat"><div class="num">${state.history.length}</div><div class="label">Daily resets</div></div><div class="stat"><div class="num">${state.goals.filter(g=>(g.progress||0)>=100).length}</div><div class="label">Goals finished</div></div></div><div class="notice" style="margin-top:16px"><b>Momentum</b><br>${done?'You are building measurable momentum. Keep the next action small and repeatable.':'Complete a few tasks first and your deeper progress picture will start to form.'}</div>`)}
function planningCalendar(){if(!requirePlus('Smart Calendar Planning'))return;const upcoming=state.tasks.filter(t=>t.due&&!t.done).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,8);openModal('Smart Calendar Planning',`<p class="muted">Your next scheduled actions are grouped here so you can plan ahead without scanning the whole app.</p>${upcoming.length?upcoming.map(t=>`<div class="listRow"><b>${esc(t.title)}</b><span class="small">${esc(t.due)}</span></div>`).join(''):'<div class="empty">No upcoming dated tasks yet.</div>'}`)}

function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return new Intl.NumberFormat(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0)}
function go(id){location.hash=id;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');renderNav();render();window.scrollTo({top:0,behavior:'smooth'})}
function renderNav(){const nav=document.getElementById('nav');if(nav)nav.innerHTML=NAV.map(([id,ic,label])=>`<button class="${(location.hash.slice(1)||'dashboard')===id?'active':''}" onclick="go('${id}')">${ic}&nbsp;&nbsp;${label}</button>`).join('');const n=state.user.name||'Your Life';const sn=document.getElementById('sideName');const av=document.getElementById('avatar');if(sn)sn.textContent=n;if(av)av.textContent=n.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase()||'LR'}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1)||'dashboard';if(document.getElementById(id))go(id)});
function header(title,sub,actions=''){return `<div class="top"><div><div class="eyebrow">Life Reset</div><h1>${title}</h1><div class="muted">${sub}</div></div><div class="row">${actions||''}</div></div>`}function completed(){return state.tasks.filter(t=>t.done).length}
function openTasks(){return state.tasks.filter(t=>!t.done)}
function pct(){return state.tasks.length?Math.round(completed()/state.tasks.length*100):0}
function todayText(){return new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
function taskList(items,empty='Nothing here yet.'){if(!items.length)return `<div class="empty">${empty}</div>`;return items.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div style="flex:1"><div class="taskTitle">${esc(t.title)}</div><span class="tag ${t.priority==='high'?'red':t.priority==='low'?'green':''}">${esc(t.priority||'normal')}</span><span class="tag blue">${esc(t.category||'general')}</span></div><button class="btn danger" onclick="deleteTask('${t.id}')">×</button></div>`).join('')}
function plusLockedPage(title,subtitle,features){return header(title,subtitle)+'<div class="card premium" style="max-width:900px;margin:0 auto"><div class="eyebrow" style="color:#b9aaff">LIFE RESET PLUS</div><h2 style="font-size:32px">This workspace is part of Plus.</h2><p class="muted">This is not a disabled button. The Plus workspace is intentionally locked for free accounts. Subscribe to unlock the complete experience.</p><div class="grid g2" style="margin-top:20px">'+features.map(x=>'<div class="stat"><b>'+esc(x[0])+'</b><div class="small">'+esc(x[1])+'</div></div>').join('')+'</div><div class="card" style="margin-top:20px;background:#fff;color:#171722"><div class="row" style="justify-content:space-between;align-items:center"><div><div class="price">$7.99<span style="font-size:13px"> / month</span></div><div class="small">Secure monthly subscription through PayPal.</div></div><span class="tag blue">PLUS</span></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="window.startPayPalCheckout()">Unlock Life Reset Plus</button></div></div>'}
function render(){renderNav();renderDashboard();renderToday();renderBrain();renderMoney();renderCareer();renderGoals();renderProgress();renderCalendar();renderPremium();renderContact();renderSettings()}

function renderMoney(){const bills=state.bills.reduce((a,x)=>a+Number(x.amount||0),0),inc=state.income.reduce((a,x)=>a+Number(x.amount||0),0),bal=inc-bills;document.getElementById('money').innerHTML=header('Money Reset','See what is coming in, what is going out, and what needs attention.',`<button class="btn primary" onclick="openMoney('bill')">+ Bill</button><button class="btn" onclick="openMoney('income')">+ Income</button><button class="btn" onclick="smartMoney()">★ Smart Forecast <span class="tag" style="margin:0;background:#eee9ff;color:var(--brand)">PLUS</span></button>`)+`<div class="grid g3"><div class="stat moneyBox"><div class="small">Tracked income</div><div class="num positive">$${money(inc)}</div></div><div class="stat moneyBox"><div class="small">Tracked bills</div><div class="num negative">$${money(bills)}</div></div><div class="stat moneyBox"><div class="small">Difference</div><div class="num ${bal<0?'negative':'positive'}">${bal<0?'-':''}$${money(Math.abs(bal))}</div></div></div><div class="grid g2" style="margin-top:18px"><div class="card"><div class="sectionHead"><h2>Bills</h2><span class="small">${state.bills.length} tracked</span></div>${state.bills.length?state.bills.map((x,i)=>`<div class="listRow"><div><b>${esc(x.name)}</b><div class="small">${esc(x.due||'No due date')}</div></div><div class="row"><b>$${money(x.amount)}</b><button class="btn danger" onclick="removeItem('bills',${i})">×</button></div></div>`).join(''):'<div class="empty">Add your first bill.</div>'}</div><div class="card"><div class="sectionHead"><h2>Income</h2><span class="small">${state.income.length} tracked</span></div>${state.income.length?state.income.map((x,i)=>`<div class="listRow"><div><b>${esc(x.name)}</b><div class="small">${esc(x.date||'')}</div></div><div class="row"><b>$${money(x.amount)}</b><button class="btn danger" onclick="removeItem('income',${i})">×</button></div></div>`).join(''):'<div class="empty">Add your income sources.</div>'}</div></div>`}
function renderCareer(){document.getElementById('career').innerHTML=header('Career Reset','Keep your job search or work goals moving with a simple pipeline.','<button class="btn primary" onclick="openCareer()">+ Application</button><button class="btn" onclick="careerInsights()">★ Career Insights <span class="tag" style="margin:0;background:#eee9ff;color:var(--brand)">PLUS</span></button>')+`<div class="grid g4"><div class="stat"><div class="num">${state.applications.length}</div><div class="label">Applications</div></div><div class="stat"><div class="num">${state.applications.filter(x=>x.status==='Interview').length}</div><div class="label">Interviews</div></div><div class="stat"><div class="num">${state.applications.filter(x=>x.status==='Offer').length}</div><div class="label">Offers</div></div><div class="stat"><div class="num">${state.applications.filter(x=>x.status==='Applied').length}</div><div class="label">Awaiting reply</div></div></div><div class="card" style="margin-top:18px"><div class="grid g3">${['Target','Applied','Interview','Offer'].map(s=>`<div><div class="eyebrow">${s}</div>${state.applications.filter(x=>x.status===s).map((x,i)=>`<div class="task"><div style="flex:1"><b>${esc(x.role)}</b><div class="small">${esc(x.company||'')}</div></div><button class="btn" onclick="advanceApp('${x.id}')">→</button></div>`).join('')||'<div class="empty" style="margin-top:9px">None yet</div>'}</div>`).join('')}</div></div>`}
function renderGoals(){document.getElementById('goals').innerHTML=header('Goals','Turn the things you want into visible next actions.','<button class="btn primary" onclick="openGoal()">+ Goal</button><button class="btn" onclick="goalRoadmap()">★ Goal Roadmap <span class="tag" style="margin:0;background:#eee9ff;color:var(--brand)">PLUS</span></button>')+`<div class="grid g2">${state.goals.length?state.goals.map((g,i)=>`<div class="card"><div class="sectionHead"><div><div class="eyebrow">${esc(g.category||'Personal')}</div><h2>${esc(g.title)}</h2></div><button class="btn danger" onclick="removeItem('goals',${i})">×</button></div><p class="muted">${esc(g.next||'Define the next action.')}</p><div class="progress"><i style="width:${Math.min(100,Number(g.progress)||0)}%"></i></div><div class="row" style="justify-content:space-between;margin-top:9px"><span class="small">${g.progress||0}%</span><button class="btn" onclick="advanceGoal(${i})">+ 10%</button></div></div>`).join(''):'<div class="card"><div class="empty">No goals yet. Add one with a clear next action.</div></div>'}</div>`}
function renderProgress(){if(!hasPlus()){document.getElementById('progress').innerHTML=plusLockedPage('Progress','Your complete Life Reset progress workspace.',[['Deep Progress Insights','See patterns across tasks, goals, resets and career activity.'],['Momentum tracking','Track completion and consistency as a complete picture.'],['Reset history','Review your progress over time instead of only today.'],['Goal progress','Connect completed actions with your bigger goals.']]);return}const p=pct();document.getElementById('progress').innerHTML=header('Progress','Measure movement, not perfection.','<button class="btn primary" onclick="progressInsights()">★ Deep Insights <span class="tag" style="margin:0;background:#fff;color:var(--brand)">PLUS</span></button>')+`<div class="card"><div class="grid g2"><div><div class="eyebrow">Your momentum</div><h2>${p}% of your current task plan is complete.</h2><p class="muted">Every completed action is movement.</p><div class="progress"><i style="width:${p}%"></i></div></div><div style="display:grid;place-items:center"><div class="circle" style="--deg:${p*3.6}deg"><strong>${p}%</strong></div></div></div></div><div class="grid g4"><div class="stat"><div class="num">${completed()}</div><div class="label">Tasks completed</div></div><div class="stat"><div class="num">${state.history.length}</div><div class="label">Daily resets</div></div><div class="stat"><div class="num">${state.goals.filter(g=>(g.progress||0)>=100).length}</div><div class="label">Goals finished</div></div><div class="stat"><div class="num">${state.applications.length}</div><div class="label">Career records</div></div></div><div class="card" style="margin-top:18px"><h2>Reset history</h2>${state.history.length?state.history.slice().reverse().map(x=>`<div class="listRow"><b>${esc(x.date)}</b><span class="small">${x.completed} tasks completed</span></div>`).join(''):'<div class="empty">Your history will build as you use Daily Reset.</div>'}</div>`}
function renderCalendar(){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),name=d.toLocaleDateString(undefined,{month:'long',year:'numeric'});let cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let day=1;day<=days;day++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const has=state.tasks.some(t=>t.due===iso);cells+=`<div class="day ${day===d.getDate()?'today':''}"><b>${day}</b>${has?'<div><span class="dot"></span><span class="small">task</span></div>':''}</div>`}document.getElementById('calendar').innerHTML=header(name,'A lightweight view of deadlines attached to your tasks.','<button class="btn primary" onclick="planningCalendar()">★ Smart Planning <span class="tag" style="margin:0;background:#fff;color:var(--brand)">PLUS</span></button>')+`<div class="card"><div class="calendar">${cells}</div></div><div class="card"><h2>Upcoming task dates</h2>${state.tasks.filter(t=>t.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,12).map(t=>`<div class="listRow"><b>${esc(t.title)}</b><span class="small">${esc(t.due)}</span></div>`).join('')||'<div class="empty">Add due dates to tasks to see them here.</div>'}</div>`}
function renderPremium(){document.getElementById('premium').innerHTML=header('Life Reset Plus','Build a calmer, more organized life with your personal reset tools.')+`<div class="card premium"><div class="eyebrow" style="color:#b9aaff">LIFE RESET PLUS</div><h2>A real personal planning system — not another to-do list.</h2><p class="muted">Free gives you the foundation. Plus turns that foundation into an active planning system that helps you decide what to do, when to do it, and what to focus on next.</p><div class="grid g3"><div class="stat"><b>Full Life Plan</b><div class="small">Turn a brain dump into prioritized actions across your life.</div></div><div class="stat"><b>Daily Reset</b><div class="small">Get a focused sequence of your most important actions.</div></div><div class="stat"><b>Smart Calendar</b><div class="small">Turn dated tasks into an organized planning view.</div></div><div class="stat"><b>Goal Roadmaps</b><div class="small">Break goals into practical next steps instead of vague motivation.</div></div><div class="stat"><b>Unlimited advanced planning</b><div class="small">Use the deeper planning layer whenever life gets complicated.</div></div><div class="stat"><b>Ad-free + account sync</b><div class="small">A cleaner workspace with your Life Reset data tied to your account.</div></div></div><div class="card" style="margin-top:18px;background:#f8f6fb"><div class="row" style="justify-content:space-between;align-items:center"><div><div class="price">$7.99<span style="font-size:13px"> / month</span></div><div class="small">Secure monthly subscription.</div></div><span class="tag blue">PayPal</span></div><button class="btn primary" style="width:100%;margin-top:18px" onclick="window.startPayPalCheckout()">Continue with PayPal</button><div class="small" style="margin-top:12px">Plus is for the advanced planning layer. Basic tracking and personal insights stay available to everyone.</div></div></div>`}
function renderContact(){document.getElementById('contact').innerHTML=header('Contact Life Reset','Have a question, found a problem, or want to share feedback?')+`<div class="card" style="max-width:980px;margin:0 auto;padding:0;overflow:hidden"><div style="padding:30px 30px 24px;background:linear-gradient(135deg,#171524,#33264d);color:#fff;position:relative;overflow:hidden"><div style="position:absolute;width:220px;height:220px;border-radius:50%;background:#9c83ff;filter:blur(65px);opacity:.2;right:-70px;top:-80px"></div><div style="position:relative;z-index:1"><div class="eyebrow" style="color:#b9aaff">SUPPORT CENTER</div><h2 style="font-size:30px;margin-top:8px">Need more assistance?</h2><p style="color:#d7d2e2;max-width:620px;line-height:1.6;margin:8px 0 0">Complete the Life Reset assistance form for guided support. Your answers help us understand exactly what you need.</p></div></div><div style="padding:22px;background:#faf9fd"><div class="notice" style="text-align:center;margin-bottom:16px;padding:12px 16px"><b>Life Reset Assistance Form</b><div class="small" style="margin-top:4px">Fill it out below, or open it in a new tab.</div><a href="https://docs.google.com/forms/d/e/1FAIpQLSewfuoKEirB6ikGXLc6qHq5QIrnA0HxlkrN5Kf7o1_E55ypXw/viewform?usp=header" target="_blank" rel="noopener noreferrer" style="font-weight:850;text-decoration:none;color:var(--brand)">Open form in a new tab ↗</a></div><div style="background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 28px rgba(30,24,70,.06)"><iframe title="Life Reset Assistance Form" src="https://docs.google.com/forms/d/e/1FAIpQLSewfuoKEirB6ikGXLc6qHq5QIrnA0HxlkrN5Kf7o1_E55ypXw/viewform?embedded=true" style="width:100%;height:820px;border:0;display:block"></iframe></div></div></div>`}
async function submitSupport(){const s=document.getElementById('supportSubject')?.value.trim(),m=document.getElementById('supportMessage')?.value.trim(),st=document.getElementById('supportStatus');if(!s||!m){if(st)st.textContent='Please add a subject and message.';return}try{let client=window.LR_SUPABASE;if(!client&&window.supabase&&window.LIFE_RESET_CONFIG){client=window.supabase.createClient(window.LIFE_RESET_CONFIG.SUPABASE_URL,window.LIFE_RESET_CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});window.LR_SUPABASE=client}if(!client){st.textContent='Support is temporarily unavailable. Please refresh and try again.';return}const {data:{user},error:ue}=await client.auth.getUser();if(ue||!user){st.textContent='Your account session is still loading. Please wait a moment and try again.';return}st.textContent='Sending your message…';const r=await client.functions.invoke('send-support-email',{body:{subject:s,message:m}});if(r.error)throw r.error;const result=r.data||{};st.textContent=result.emailSent?'Message sent. A full copy was emailed to you.':'Message saved. Email delivery is still being configured.';document.getElementById('supportSubject').value='';document.getElementById('supportMessage').value='';}catch(e){console.error(e);st.textContent=e?.message||'We could not send your message. Please try again.';}}
function renderSettings(){document.getElementById('settings').innerHTML=header('Settings','Control your profile and local data.')+`<div class="card"><h2>Profile</h2><div class="grid g2"><div class="field"><label>Name</label><input id="name" value="${esc(state.user.name)}" placeholder="Your name"></div><div class="field"><label>Email</label><input id="email" value="${esc(state.user.email)}" placeholder="you@example.com"></div></div><button class="btn primary" style="margin-top:14px" onclick="saveProfile()">Save profile</button></div><div class="card"><h2>Data</h2><div class="row"><button class="btn" onclick="exportData()">Export my data</button><button class="btn danger" onclick="resetAll()">Delete local data</button></div><p class="small" style="margin-top:10px">Your Life Reset information is saved to your secure account in the cloud. Sign in on another device to continue where you left off.</p></div>`}
function organizeBrain(){const text=document.getElementById('brainText').value.trim();if(!text){toast('Write something first.');return}state.brain=text;const lines=text.split(/\n|[.!?]+/).map(x=>x.trim()).filter(x=>x.length>2);const made=[];lines.forEach(line=>{const l=line.toLowerCase();let cat='personal',priority='normal';if(/bill|rent|money|debt|pay|bank|budget|expense|electric|water/.test(l))cat='money';else if(/job|work|resume|cv|interview|career|boss/.test(l))cat='career';else if(/child|kid|school|son|daughter|family|birthday|doctor/.test(l))cat='family';else if(/clean|laundry|home|house|room|grocer/.test(l))cat='home';else if(/study|class|course|exam|assignment/.test(l))cat='school';if(/urgent|today|due|asap|deadline|tomorrow|overdue/.test(l))priority='high';made.push({id:uid(),title:line.replace(/^[-•\d.)]+\s*/,''),category:cat,priority,done:false,source:'brain',due:''})});state.tasks=[...state.tasks.filter(t=>t.source!=='brain'),...made];save();toast(`${made.length} action${made.length===1?'':'s'} organized.`);go('today')}
function toggleTask(id){const t=state.tasks.find(x=>x.id===id);if(t){t.done=!t.done;if(t.done)t.completedAt=new Date().toISOString();save();}}
function deleteTask(id){const target=String(id);state.tasks=state.tasks.filter(t=>t&&String(t.id)!==target);localStorage.setItem(KEY,JSON.stringify(state));render();save();toast('Task deleted.');}
function openAddTask(pref=''){openModal('Add a task',`<div class="field"><label>Task</label><input id="fTitle" placeholder="What needs to happen?" value="${esc(pref)}"></div><div class="grid g2" style="margin-top:12px"><div class="field"><label>Category</label><select id="fCat"><option>personal</option><option>money</option><option>home</option><option>family</option><option>career</option><option>school</option></select></div><div class="field"><label>Priority</label><select id="fPri"><option>normal</option><option>high</option><option>low</option></select></div></div><div class="field" style="margin-top:12px"><label>Due date</label><input id="fDue" type="date"></div>`,`addTaskFromForm()`)}
function addTaskFromForm(){const title=document.getElementById('fTitle').value.trim();if(!title){toast('Add a task name.');return}state.tasks.push({id:uid(),title,category:document.getElementById('fCat').value,priority:document.getElementById('fPri').value,due:document.getElementById('fDue').value,done:false});closeModal();save();toast('Task added.')}
function quickMode(cat){go(cat==='money'?'money':cat==='career'?'career':'brain')}
function dailyReset(){if(!requirePlus('Daily Reset'))return;const open=openTasks();if(!open.length){toast('Your task list is clear — nice work.');return}const top=open.slice().sort((a,b)=>(b.priority==='high')-(a.priority==='high'))[0];openModal('Your Daily Reset',`<div class="notice"><b>Start here:</b><br>${esc(top.title)}</div><p class="muted" style="margin-top:14px">Do only this one thing first. When it is done, come back for the next step.</p><div class="row"><button class="btn primary" onclick="closeModal();go('today')">Open task</button><button class="btn" onclick="closeModal()">I know what to do</button></div>`)}
function openMoney(type){const title=type==='bill'?'Add a bill':'Add income';openModal(title,`<div class="field"><label>Name</label><input id="mName" placeholder="${type==='bill'?'Electricity':'Salary'}"></div><div class="field" style="margin-top:12px"><label>Amount</label><input id="mAmount" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="field" style="margin-top:12px"><label>${type==='bill'?'Due date':'Date'}</label><input id="mDate" type="date"></div>`,`addMoney('${type}')`)}
function addMoney(type){const name=document.getElementById('mName').value.trim(),amount=Number(document.getElementById('mAmount').value);if(!name||!amount){toast('Enter a name and amount.');return}state[type==='bill'?'bills':'income'].push({name,amount,date:document.getElementById('mDate').value,due:document.getElementById('mDate').value});closeModal();save()}
function removeItem(key,i){state[key].splice(i,1);save()}
function openCareer(){openModal('Add career record',`<div class="field"><label>Role</label><input id="cRole" placeholder="Customer service representative"></div><div class="field" style="margin-top:12px"><label>Company</label><input id="cCompany" placeholder="Company name"></div><div class="field" style="margin-top:12px"><label>Status</label><select id="cStatus"><option>Target</option><option>Applied</option><option>Interview</option><option>Offer</option></select></div>`,`addCareer()`)}
function addCareer(){const role=document.getElementById('cRole').value.trim();if(!role){toast('Enter a role.');return}state.applications.push({id:uid(),role,company:document.getElementById('cCompany').value,status:document.getElementById('cStatus').value});closeModal();save()}
function advanceApp(id){const x=state.applications.find(a=>a.id===id);if(!x)return;const seq=['Target','Applied','Interview','Offer'];x.status=seq[Math.min(seq.indexOf(x.status)+1,seq.length-1)];save();toast(`Moved to ${x.status}.`)}
function openGoal(){openModal('Create a goal',`<div class="field"><label>Goal</label><input id="gTitle" placeholder="What do you want to change?" ></div><div class="field" style="margin-top:12px"><label>Category</label><select id="gCat"><option>Personal</option><option>Money</option><option>Career</option><option>Home</option><option>Family</option></select></div><div class="field" style="margin-top:12px"><label>Next action</label><input id="gNext" placeholder="What is the next physical action?"></div>`,`addGoal()`)}
function addGoal(){const title=document.getElementById('gTitle').value.trim();if(!title){toast('Give your goal a name.');return}state.goals.push({title,category:document.getElementById('gCat').value,next:document.getElementById('gNext').value,progress:0});closeModal();save()}
function advanceGoal(i){state.goals[i].progress=Math.min(100,(Number(state.goals[i].progress)||0)+10);save()}
function saveProfile(){state.user.name=document.getElementById('name').value.trim();state.user.email=document.getElementById('email').value.trim();save();toast('Profile saved.')}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='life-reset-data.json';a.click();URL.revokeObjectURL(a.href)}
function resetAll(){if(confirm('Delete all Life Reset data from this browser?')){localStorage.removeItem(KEY);location.reload()}}
function openModal(title,body,action=''){document.getElementById('modalCard').innerHTML=`<div class="sectionHead"><h2>${title}</h2><button class="btn" onclick="closeModal()">×</button></div>${body}${action?`<div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="${action}">Save</button></div>`:''}`;document.getElementById('modal').classList.add('open');setTimeout(()=>document.querySelector('#modal input')?.focus(),50)}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function openMobile(){openModal('Life Reset',NAV.map(([id,ic,label])=>`<button class="btn" style="width:100%;text-align:left;margin:4px 0" onclick="closeModal();go('${id}')">${ic}&nbsp;&nbsp;${label}</button>`).join(''))}
function toast(msg){const t=document.getElementById('toast');if(!t)return; t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
